[package]
name = "celov"
version = "0.3.0"
edition = "2024"
description = "A Combined Developer Environment (CDE) containing everyday development tools."
license = "MIT"
readme = "README.md"
repository = "https://github.com/syfos/celov"
keywords = ["sycode", "celov", "procpal", "tui", "cli"]
categories = ["command-line-utilities"]

default-run = "celov"

[dependencies]
ratatui = "0.30.2"
clap = {version = "4.6.1", features=["derive"]}
crossterm = "0.29.0"
shellexpand = "3.1.2"
git2 = "0.21.0"
anyhow = "1.0.103"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
ropey = "1.6.1"
icu_segmenter = "2.3.0"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
unicode-normalization = "0.1.25"
unicode-bidi = "0.3.18"
grep-matcher = "0.1.9"
grep-searcher = "0.1.17"
ignore = "0.4.33"
grep-regex = "0.1.14"
regex = "1.13.1"
